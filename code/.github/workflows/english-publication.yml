name: English publication language check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the current tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check public source language
        run: python3 scripts/check_public_language.py
